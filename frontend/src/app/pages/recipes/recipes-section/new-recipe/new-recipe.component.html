<div class="recipe-card" [formGroup]="form">
  <div class="recipe-header">
    <input type="text" formControlName="name" class="recipe-title" placeholder="Nom de la recette">
    
    <div class="recipe-info">
      <span class="icon">
        <i class="fas fa-stopwatch"></i>
        <input type="number" formControlName="duration" min="1" class="small-input" placeholder="Durée">
      </span>
      <span class="icon">
        <i class="fas fa-user"></i>
        <input type="number" formControlName="nbPeople" min="1" class="small-input" placeholder="Nb Pers.">
      </span>
      <span class="icon">
        <i class="fas fa-star filled"></i>
        <input type="number" formControlName="rating" min="0" max="5" class="small-input" placeholder="Note">
      </span>
    </div>
  </div>
  
  <div class="recipe-details">
    <app-recipe-ingredient-list
      [recipeIngredients]="recipe.ingredients"
      [editingMode] = "true">
    </app-recipe-ingredient-list>
  
    <h4>Description</h4>
    <textarea formControlName="description" class="description" placeholder="Description" autoResize  [maxHeight]="200"></textarea>
  </div>
  <div class="recipe-footer">
    <div class="actions">
      <button class="cancel-button" (click)="cancelModification()">Annuler</button>
      <button class="save-button" (click)="saveModification()">Sauvegarder</button>
    </div>
  </div>  
</div>
